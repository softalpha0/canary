[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read-write", path = "./test/vectors" },
  { access = "read", path = "../deployments" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.invariant]
runs = 256
depth = 50

[rpc_endpoints]
qorechain_testnet = "${EVM_RPC_URL}"

[fmt]
line_length = 120
